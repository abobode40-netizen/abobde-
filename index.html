<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Catch and suppress benign Vite dev server WebSocket transport disconnect in iframe sandbox
      window.addEventListener('error', function(e) {
        if (e && ((e.filename && e.filename.indexOf('@vite/client') !== -1) || (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('createWebSocketModuleRunnerTransport') !== -1)))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = e && e.reason ? String(e.reason) : '';
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
    <title>جنّة الرحمن - رفيقك في الذكر والقرآن</title>
    <meta name="description" content="تطبيق وموقع جنّة الرحمن للقرآن الكريم وغراس الأذكار وثمار المشايخ وشجرة العبادات اليومية." />
    <meta name="theme-color" content="#0A192F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="جنّة الرحمن" />
    <link rel="icon" type="image/svg+xml" href="/jannat-icon.svg" />
    <link rel="apple-touch-icon" href="/jannat-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#0A192F] text-[#EAF1FA] antialiased selection:bg-[#38BDF8] selection:text-[#0A192F]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clear any stale service workers in dev sandbox preview to ensure 100% fresh instant loading
      if ('serviceWorker' in navigator) {
        var isDevEnv = window.location.hostname.includes('run.app') || window.location.hostname === 'localhost' || window.location.port === '3000';
        if (isDevEnv) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) {
                if (k.indexOf('static') !== -1 || k.indexOf('dynamic') !== -1) {
                  caches.delete(k);
                }
              });
            });
          }
        } else {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
        }
      }
    </script>
  </body>
</html>
