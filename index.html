    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet" />

  <body class="bg-[#FAF7F0] text-[#19302A] antialiased selection:bg-[#0F6B50] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // تسجيل وتحديث عامل الخدمة (Service Worker) فوراً مع التحديث التلقائي
      if ('serviceWorker' in navigator) {
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(registration) {
            // فحص وجود أي إصدار أحدث فور فتح التطبيق
            registration.update();

            registration.onupdatefound = function() {
              var installingWorker = registration.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function() {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    installingWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                };
              }
            };
          })
          .catch(function(err) {
            console.warn('Service worker registration failed:', err);
          });
      }
    </script>
  </body>
</html>
